# ACL Anthology venue-year -> collection mapping. Decision: 006.
#
# Hand-verified against volume booktitles. `expected` is a SELF-CONSISTENCY check:
# it comes from the same XML the parser reads, so it catches parser bugs and future
# source drift, NOT under-collection by the Anthology itself. Independent validation
# is the DBLP recall check (002).
#
# Absent by design: naacl 2020 and 2023 (conference did not run);
# emnlp/naacl 2026 (not yet announced as of 2026-08-27).

[[collection]]
venue = "acl"
year = 2018
collection = "P18"
main_volumes = ["1", "2"]
expected = 381
note = "legacy: vol1 Long, vol2 Short"

